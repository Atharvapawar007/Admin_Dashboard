<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">header</div>
        <div class="sidebar">
            <div class="sidebar-container">
                <div class="logo">
                    <img src="svgs/dashboard-logo.svg" alt="dashboard logo">
                    Dashboard
                </div>

                <div class="menu-1">
                    <div class="menu-item">
                        <img src="svgs/home.svg" alt="" class="item-logo">
                        Home
                    </div>
                    <div class="menu-item">
                        <img src="svgs/profile.svg" alt="" class="item-logo">
                        Profile
                    </div>
                    <div class="menu-item">
                        <img src="svgs/message.svg" alt="" class="item-logo">
                        Messages
                    </div>
                    <div class="menu-item">
                        <img src="svgs/history.svg" alt="" class="item-logo">
                        History
                    </div>
                    <div class="menu-item">
                        <img src="svgs/tasks.svg" alt="" class="item-logo">
                        Tasks
                    </div>
                    <div class="menu-item">
                        <img src="svgs/community.svg" alt="" class="item-logo">
                        Communities
                    </div>
                </div>

                <div class="menu-2">
                    <div class="menu-item">
                        <img src="svgs/settings.svg" alt="" class="item-logo">
                        Settings
                    </div>
                    <div class="menu-item">
                        <img src="svgs/support.svg" alt="" class="item-logo">
                        Support
                    </div>
                    <div class="menu-item">
                        <img src="svgs/privacy.svg" alt="" class="item-logo">
                        Privacy
                    </div>
                </div>
            </div>
        </div>
        <div class="main-area">
            <div class="main-container">
               <div class="projects">
                    <p class="projects-title">Your Projects</p>
                    <div class="projects-grid">
                        <div class="projects-card"></div>
                        <div class="projects-card"></div>
                        <div class="projects-card"></div>
                        <div class="projects-card"></div>
                        <div class="projects-card"></div>
                        <div class="projects-card"></div>
                    </div>
               </div>
               <div class="announcements">
                    <p class="announcements-title">Announcements</p>
                    <div class="announcements-card"></div>
               </div>
               <div class="trending">
                    <p class="trending-title">Trending</p>
                    <div class="trending-card"></div>
               </div>
            </div>
        </div>
    </div>
</body>
</html>
